{% set name = "sqlmermaid" %}
{% set version = "1.0.1" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/sqlmermaid-{{ version }}.tar.gz
  sha256: bfa89a21f1e355ed8d09256722b5144af7d2520ec4a025dd2559c071a30810a4

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - sqlalchemy >=2.0.0

test:
  imports:
    - sqlmermaid
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/endremborza/sqlmermaid
  summary: Visualizing SQL databases
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dhirschfeld
