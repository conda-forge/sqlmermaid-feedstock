{% set name = "sqlmermaid" %}
{% set version = "1.0.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sqlmermaid-{{ version }}.tar.gz
  sha256: 9bf0a75b6f0d0b5b029a7fcb9b36b92e8c8e02b64e2470bbed1af47c6033c240

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - sqlalchemy >=2.0.0

test:
  imports:
    - sqlmermaid
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/endremborza/sqlmermaid
  summary: Visualizing SQL databases
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - dhirschfeld
